<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Program flowers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="card" id="card">
    <div class="card__icon">🌹</div>
    <h1 class="card__title">You are my flower</h1>
    <div class="bar"><div class="bar__fill" id="barFill"></div></div>
    <p class="card__status" id="status">Creando pétalos digitales...</p>
    <button class="btn" id="btn" disabled>Generar</button>
  </main>

  <section class="scene" id="scene">
    <p class="text text--top">I LOVE YOU :3</p>

    <div class="stage" id="stage">
      <div class="halo"></div>

      <svg id="flower-frame" viewBox="0 0 800 640" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gPink" x1="0" y1="0" x2="0" y2="-1">
            <stop offset="0" stop-color="#fff4f8" stop-opacity=".95" />
            <stop offset=".5" stop-color="#ffb3d6" stop-opacity=".85" />
            <stop offset="1" stop-color="#ff7fbf" stop-opacity=".78" />
          </linearGradient>
          <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="-1">
            <stop offset="0" stop-color="#fff0f6" stop-opacity=".95" />
            <stop offset=".55" stop-color="#f3a8d8" stop-opacity=".8" />
            <stop offset="1" stop-color="#a9c4ff" stop-opacity=".65" />
          </linearGradient>
          <linearGradient id="gWhite" x1="0" y1="0" x2="0" y2="-1">
            <stop offset="0" stop-color="#fff8dc" />
            <stop offset=".6" stop-color="#ffe0ee" stop-opacity=".95" />
            <stop offset="1" stop-color="#ffbcdc" stop-opacity=".85" />
          </linearGradient>
          <linearGradient id="gIri" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6fb4ff" />
            <stop offset=".5" stop-color="#b08cff" />
            <stop offset="1" stop-color="#ff9ad0" />
          </linearGradient>
          <radialGradient id="gCore">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset=".3" stop-color="#ffe9a6" stop-opacity=".9" />
            <stop offset="1" stop-color="#ff9a4d" stop-opacity="0" />
          </radialGradient>
        </defs>

        <g id="vines"></g>

        <path class="stem" d="M400 520 L400 640" />

        <g transform="translate(400 520)">
          <g class="rise">
            <g class="breath">
              <circle class="core" r="130" cy="-50" fill="url(#gCore)" />
              <g id="lotus"></g>
            </g>
          </g>
        </g>
      </svg>
    </div>

    <p class="text text--bottom">I hope you like it and have a lovely day today❤️<span>🌹</span></p>
    <div id="sparkles"></div>
  </section>

  <script src="js/script.js"></script>
</body>
</html>
